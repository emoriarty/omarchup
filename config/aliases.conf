# ==============================================================================
# Omarchup Shell Aliases Configuration
# ==============================================================================
# Personal shell aliases managed by omarchup.
# Synchronized to ~/.bash_aliases and sourced in ~/.bashrc.
# ==============================================================================

# Associative array of custom aliases: [alias_name]="command"
declare -g -A ALIASES=(
  # Rails shortcuts
  ["rc"]="bin/rails console"
  ["rs"]="bin/rails server"
  ["rdb"]="bin/rails dbconsole"
  ["rdm"]="bin/rails db:migrate"
  ["rdr"]="bin/rails db:rollback"
  ["routes"]="bin/rails routes"
  ["rt"]="bin/rails test"
)
