# ==============================================================================
# Omarchup Dotfiles Configuration
# ==============================================================================
# Configures the dotfiles repository and GNU Stow modules to link.
# ==============================================================================

# Git repository URL for personal dotfiles
DOTFILES_REPO_URL="https://github.com/emoriarty/dotfiles"

# Target directory where the dotfiles repo is cloned
DOTFILES_DIR="${HOME}/dotfiles"

# Git branch to track
DOTFILES_BRANCH="master"

# ------------------------------------------------------------------------------
# Safe modules to stow on Omarchy OS
# ------------------------------------------------------------------------------
# These modules configure standalone CLI tools, editors, and terminal emulators
# that integrate seamlessly with Omarchy without clashing with the desktop shell.
SAFE_MODULES=(
  nvim                  # Neovim configuration (~/.config/nvim)
  editorconfig          # EditorConfig rules (~/.editorconfig)
  kitty                 # Kitty terminal config (~/.config/kitty)
  alacritty             # Alacritty terminal config (~/.config/alacritty)
  starship              # Starship prompt (~/.config/starship.toml)
  tmux                  # Tmux terminal multiplexer (~/.tmux.conf)
  backgrounds           # Wallpapers and background assets
)

# ------------------------------------------------------------------------------
# Conflicting modules (DISABLED by default on Omarchy OS)
# ------------------------------------------------------------------------------
# The following modules are deliberately NOT stowed by default because Omarchy
# provides native, integrated implementations:
#
# - hyprland    : Omarchy configures Hyprland via Lua (~/.config/hypr/*.lua).
#                 Stowing hyprland.conf overrides Omarchy's theme, bindings, and rules.
# - waybar      : Omarchy uses Quickshell (`omarchy-shell`) for the bar.
# - wofi        : Omarchy uses its native Quickshell application launcher (`omarchy-menu`).
# - bash_arch   : Omarchy requires sourcing `/usr/share/omarchy/default/bash/env-bootstrap`
#                 and `$OMARCHY_PATH/default/bash/rc` in ~/.bashrc.
#
# If you want to force-stow any of these, move them to SAFE_MODULES or use `omarchup dotfiles --force <module>`.
DISABLED_MODULES=(
  hyprland
  waybar
  wofi
  bash_arch
  bash_ubuntu
)
