# ==============================================================================
# Omarchup Dotfiles Configuration
# ==============================================================================
# Configures the dotfiles repository and GNU Stow modules to link.
# ==============================================================================

# Git repository URL for personal dotfiles
DOTFILES_REPO_URL="https://github.com/emoriarty/dotfiles"

# Target directory where the dotfiles repo is cloned
DOTFILES_DIR="${HOME}/dotfiles"

# Git branch to track
DOTFILES_BRANCH="master"

# ------------------------------------------------------------------------------
# Safe modules to stow on Omarchy OS
# ------------------------------------------------------------------------------
# Strictly non-conflicting modules that don't collide with Omarchy defaults.
SAFE_MODULES=(
  tmux                  # Tmux configuration (~/.tmux.conf)
  editorconfig          # Global EditorConfig rules (~/.editorconfig)
)

# ------------------------------------------------------------------------------
# Conflicting modules (DISABLED by default on Omarchy OS)
# ------------------------------------------------------------------------------
# These modules are excluded because Omarchy OS manages its own configurations:
#
# - nvim        : Omarchy ships its own tuned LazyVim setup in ~/.config/nvim/.
# - kitty       : Omarchy manages terminal configs and themes dynamically.
# - alacritty   : Omarchy manages terminal configs and themes dynamically.
# - starship    : Omarchy manages starship prompt configuration (~/.config/starship.toml).
# - backgrounds : Omarchy handles wallpapers and themes via `omarchy theme`.
# - hyprland    : Omarchy configures Hyprland via Lua (~/.config/hypr/*.lua).
# - waybar      : Omarchy uses Quickshell (`omarchy-shell`) for the status bar.
# - wofi        : Omarchy uses its native Quickshell application menu (`omarchy-menu`).
# - bash_arch   : Omarchy requires sourcing env-bootstrap and rc in ~/.bashrc.
DISABLED_MODULES=(
  nvim
  kitty
  alacritty
  starship
  backgrounds
  hyprland
  waybar
  wofi
  bash_arch
  bash_ubuntu
)
