# ==============================================================================
# Omarchup Packages Configuration
# ==============================================================================
# Packages declared here will be installed and kept present on Omarchy OS.
# Omarchup uses `omarchy pkg add` for official/omarchy repo packages, and
# `omarchy pkg aur add` for AUR packages.
# ==============================================================================

# Core & Essential Tooling
CORE_TOOLS=(
  stow                  # GNU Stow for dotfiles symlink management
  git                   # Distributed version control
)

# Personal Applications
APPS=(
  1password             # Password manager (provided by Omarchy repo)
  vlc                   # Media player
  vlc-plugin-upnp       # UPnP playback plugin for VLC
)

# Personal Development Tools & Shell Enhancements
DEV_TOOLS=(
  direnv                # Directory-specific environment switcher
  keychain              # SSH and GPG key manager
  v4l-utils             # Video4Linux tools for webcams
)

# Combine into master list for official/repo packages
PACKAGES=(
  "${CORE_TOOLS[@]}"
  "${APPS[@]}"
  "${DEV_TOOLS[@]}"
)

# AUR Packages (installed via `omarchy pkg aur add`)
AUR_PACKAGES=(
  # Add personal AUR packages here if needed, e.g.:
  # 1password-cli
)
